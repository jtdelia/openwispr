version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /native/models
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      swift:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /native/helper
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      swift:
        patterns: ["*"]
