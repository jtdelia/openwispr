name: Release macOS

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$package_version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $package_version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit must be on the main branch"
            exit 1
          fi

      - name: Validate release secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for variable in \
            MACOS_CERTIFICATE \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER
          do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Required GitHub Actions secret $variable is not configured"
              exit 1
            fi
          done

      - run: npm ci

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/openwispr-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security find-identity -v -p codesigning "$keychain_path"

          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
          OPENWISPR_NOTARIZE: true
        run: |
          npm run build
          npx electron-builder --mac dmg --arm64 --config electron-builder.config.mjs --publish never

          shopt -s nullglob
          dmg_files=(dist/*.dmg)
          if (( ${#dmg_files[@]} != 1 )); then
            echo "::error::Expected exactly one DMG, found ${#dmg_files[@]}"
            exit 1
          fi
          echo "DMG_PATH=${dmg_files[0]}" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify release artifact
        run: |
          mount_path="$RUNNER_TEMP/openwispr-dmg"
          mkdir -p "$mount_path"

          hdiutil verify "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          xattr -w com.apple.quarantine "0081;00000000;GitHub Actions;" "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "$DMG_PATH"
          trap 'hdiutil detach "$mount_path"' EXIT

          test -d "$mount_path/OpenWispr.app"
          test -L "$mount_path/Applications"
          test "$(readlink "$mount_path/Applications")" = /Applications
          codesign --verify --deep --strict --verbose=2 "$mount_path/OpenWispr.app"
          xcrun stapler validate "$mount_path/OpenWispr.app"

          hdiutil detach "$mount_path"
          trap - EXIT

          (
            cd "$(dirname "$DMG_PATH")"
            shasum -a 256 "$(basename "$DMG_PATH")" > "$(basename "$DMG_PATH").sha256"
          )
          echo "CHECKSUM_PATH=$DMG_PATH.sha256" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG_PATH" "$CHECKSUM_PATH" --clobber
            exit 0
          fi

          release_options=(--verify-tag --generate-notes --title "OpenWispr $TAG")
          if [[ "$TAG" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$TAG" "$DMG_PATH" "$CHECKSUM_PATH" "${release_options[@]}"

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8
